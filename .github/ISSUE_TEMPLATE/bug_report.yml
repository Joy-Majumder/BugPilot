name: Bug Report
description: Report a bug or unexpected behavior in BugPilot
title: "[BUG]"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, please check if this issue has already been reported.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: "1. Run 'bugpilot scan --target https://example.com'\n2. Observe output\n3. Check reports..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "Version, OS, Python version, relevant config"
      placeholder: "BugPilot version: [e.g. main]\nOS: [e.g. macOS 14]\nPython: [e.g. 3.13]\nTarget: [e.g. https://example.com]"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Output / Logs
      description: Paste any relevant error output or log lines.
