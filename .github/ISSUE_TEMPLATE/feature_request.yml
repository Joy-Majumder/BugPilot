name: Feature Request
description: Suggest a new feature or enhancement for BugPilot
title: "[FEATURE]"
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: suggestion
    attributes:
      label: Feature Description
      description: Describe the feature you'd like and why it's valuable.
      placeholder: "As a security researcher, I want to ..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What have you tried instead? How does that fall short?
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Additional Context
      description: Screenshots, mockups, or links to similar tools.
  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      options:
        - label: I have read the contributing guidelines and this is not a duplicate request.
