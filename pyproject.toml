[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bugpilot"
version = "0.1.0"
description = "Open-source bug bounty automation that finds, validates, and reports web vulnerabilities."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.32.0",
    "jinja2==3.1.4",
    "playwright==1.48.0",
    "httpx==0.28.1",
    "sqlalchemy==2.0.36",
    "cvss==3.6",
    "typer==0.12.5",
    "dnspython==2.7.0",
    "pydantic==2.10.0",
    "pydantic-settings==2.6.1",
    "python-multipart==0.0.18",
    "aiohttp==3.10.5",
"aiofiles==24.1.0",
    "websockets==13.1",
    "lxml==5.3.0",
    "beautifulsoup4==4.12.3",
    "tldextract==5.1.2",
    "publicsuffix2==2.20191221",
    "pyyaml==6.0.1",
    "rich==13.9.4",
    "click>=8.1.7,<8.2.0",
    "tenacity==8.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "black",
    "ruff",
    "mypy",
]

[project.scripts]
bugpilot = "cli:app"

[tool.setuptools]
py-modules = ["cli"]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true